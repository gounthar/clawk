# Build, vet, format-check and test both Go modules.
#
# Linux exercises the firecracker provider's code (and all the
# platform-independent logic); macOS exercises the vz provider, which is
# cgo + Apple Virtualization.framework and only compiles on Darwin. Neither
# job boots a real VM — the end-to-end boot tests are gated behind
# TEST_GUEST_BOOT (see internal/e2e) and need /dev/kvm.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './third_party/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: root module — build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: machine module — build / vet / test
        working-directory: machine
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # The release path, which the tests above can't reach: a plain checkout
      # embeds no guest binaries, so the prebuilt tests skip themselves. Run
      # the generator, then assert a sandbox can be prepared with no Go
      # toolchain — the whole point of shipping them prebuilt.
      - name: prebuilt guest binaries — generate + use without a toolchain
        run: |
          make guestbin
          go test ./internal/guestbuild/ -run 'TestBuildUsesPrebuilt|TestPrebuiltRejectsStaleSources' -v

      # Cross-build both release artifacts, so a tag can't be the first time we
      # discover the Linux release doesn't compile.
      - name: cross-build linux release artifacts
        run: |
          for arch in amd64 arm64; do
            make clean-guestbin
            make guestbin GUEST_ARCH="$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "/tmp/clawk-linux-$arch" ./cmd/clawk
            ls -l "/tmp/clawk-linux-$arch"
          done

  macos:
    runs-on: macos-14 # Apple Silicon — required for the vz provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # make build codesigns the binary ad-hoc with the entitlements
      # Virtualization.framework requires.
      - name: root module — build (vz) / vet / test
        run: |
          make build
          go vet ./...
          go test ./...

      # TEMPORARY — diagnostic, revert before merge.
      #
      # This step hangs on macos for this branch (3 for 3) while passing on
      # both main and this branch before the merge. An earlier attempt added
      # -v, -p 1 and -timeout together and passed in 13s, which proved nothing:
      # -p 1 removed the hang, so the timeout never fired and produced no dump.
      #
      # So this changes exactly one thing from the configuration that hangs.
      # Package parallelism stays at the default, which is the condition that
      # reproduces it; -timeout 3m converts the hang into a panic carrying a
      # goroutine dump that names the blocked test and shows what the other
      # packages were doing at the time. -v records how far each package got
      # before the stall.
      #
      # df brackets the run because disk exhaustion is the leading suspect:
      # compactext4 writes 16, 32 and 64 GiB sparse images, and a macos runner
      # that does not produce real holes would fill up rather than deadlock.
      # Bounded with timeout-minutes rather than timeout(1): macos does not
      # ship the GNU coreutils binary, and the previous attempt to use it exited
      # 127 immediately, so vet never ran and nothing was learned. This is a
      # platform feature, needs no binary, and — the part that matters — a step
      # that GitHub cuts short still publishes its log, whereas the job-level
      # kill we have been hitting retains nothing.
      - name: machine module — vet (bounded)
        working-directory: machine
        timeout-minutes: 8
        run: |
          echo "=== disk ==="; df -h /
          echo "=== cpu/mem ==="; sysctl -n hw.ncpu; sysctl -n hw.memsize
          # -x prints each action as it runs, so the log's last line is the
          # package vet reached before stopping.
          time go vet -x ./... 2>&1 | tail -60

      - name: machine module — test (bounded)
        working-directory: machine
        timeout-minutes: 10
        run: |
          time go test -v -timeout 4m ./...
          echo "=== disk after ==="; df -h /
